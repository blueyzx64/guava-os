<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by Guava OS (Text rendering: lucidglyph). Removed when the style is switched back. From lucidglyph 0.16.0 (https://github.com/maximilionus/lucidglyph), GPL-3.0, by maximilionus. -->
<fontconfig>
  <description>Set hintslight to hintstyle</description>

  <match target="pattern">
    <!--
      Suggest the client to use the "Slight" font hinting style, which is the
      preferred style for both preserving the original geometry and providing
      legibility. Only applied if the target system misses any hinting
      configuration.
    -->
    <edit name="hintstyle" mode="append"><const>hintslight</const></edit>
  </match>
</fontconfig>
