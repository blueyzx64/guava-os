<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by Guava OS (Text rendering: lucidglyph). Removed when the style is switched back. From lucidglyph 0.16.0 (https://github.com/maximilionus/lucidglyph), GPL-3.0, by maximilionus. -->
<fontconfig>
  <description>Stem-darkening fallback through emboldening that compensates the lack of stem-darkening on very small glyph sizes</description>

  <match target="font">
    <test name="pixelsize" compare="less">
      <double>14.0</double>
    </test>

    <edit name="embolden" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
